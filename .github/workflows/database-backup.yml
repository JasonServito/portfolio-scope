name: Production database backup

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      diagnostic_only:
        description: "Run only the sanitized read-only connection diagnostic"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: portfolioscope-production-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20.19
          cache: npm

      - name: Install dependencies
        if: ${{ github.event_name == 'schedule' || inputs.diagnostic_only != true }}
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npm ci

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Classify PostgreSQL connection readiness
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: node scripts/diagnose-postgres-connection.mjs

      - name: Verify PostgreSQL backup tooling
        if: ${{ github.event_name == 'schedule' || inputs.diagnostic_only != true }}
        run: pg_dump --version

      - name: Create compressed logical backup
        if: ${{ github.event_name == 'schedule' || inputs.diagnostic_only != true }}
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          BACKUP_ENVIRONMENT: production
          BETTER_STACK_BACKUP_HEARTBEAT_URL: ${{ secrets.BETTER_STACK_BACKUP_HEARTBEAT_URL }}
          BETTER_STACK_BACKUP_FAILURE_HEARTBEAT_URL: ${{ secrets.BETTER_STACK_BACKUP_FAILURE_HEARTBEAT_URL }}
        run: npm run backup:postgres
