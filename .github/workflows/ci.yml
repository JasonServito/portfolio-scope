name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: portfolio_scope
          POSTGRES_USER: portfolio_scope
          POSTGRES_PASSWORD: portfolio_scope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio_scope -d portfolio_scope"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://portfolio_scope:portfolio_scope@localhost:5432/portfolio_scope?schema=public
      DIRECT_URL: postgresql://portfolio_scope:portfolio_scope@localhost:5432/portfolio_scope?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: m16-ci-only-secret-with-more-than-thirty-two-characters
      DEMO_USER_EMAIL: demo@portfolioscope.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20.19
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply database migrations
        run: npm run db:deploy

      - name: Verify safe, idempotent demo seed
        run: npm run test:integration

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Browser smoke tests
        run: npm run test:e2e

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
