name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: portfolio_scope
          POSTGRES_USER: portfolio_scope
          POSTGRES_PASSWORD: portfolio_scope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio_scope -d portfolio_scope"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://portfolio_scope:portfolio_scope@localhost:5432/portfolio_scope?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DEMO_USER_EMAIL: demo@portfolioscope.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:deploy

      - name: Seed demo data
        run: npm run db:seed

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
