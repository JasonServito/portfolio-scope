services:
  app:
    build:
      context: .
    container_name: portfolio-scope-app
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://portfolio_scope:portfolio_scope@postgres:5432/portfolio_scope?schema=public
      DIRECT_URL: postgresql://portfolio_scope:portfolio_scope@postgres:5432/portfolio_scope?schema=public

      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@portfolioscope.dev}

      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in the ignored .env file}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_GOOGLE_ENABLED: ${AUTH_GOOGLE_ENABLED:-false}
      LOCAL_DISPOSABLE_AUTH_ENABLED: ${LOCAL_DISPOSABLE_AUTH_ENABLED:-false}

      SEC_USER_AGENT: ${SEC_USER_AGENT:?Set SEC_USER_AGENT in the ignored .env file}
      SEC_CONTACT_EMAIL: ${SEC_CONTACT_EMAIL:?Set SEC_CONTACT_EMAIL in the ignored .env file}

      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      SEC_LOCAL_MANUAL_INGESTION_ENABLED: ${SEC_LOCAL_MANUAL_INGESTION_ENABLED:-false}

      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      QSTASH_TOKEN: ${QSTASH_TOKEN:-}
      QSTASH_CURRENT_SIGNING_KEY: ${QSTASH_CURRENT_SIGNING_KEY:-}
      QSTASH_NEXT_SIGNING_KEY: ${QSTASH_NEXT_SIGNING_KEY:-}

      BACKGROUND_JOBS_ENABLED: ${BACKGROUND_JOBS_ENABLED:-false}
      SEC_INGESTION_ENABLED: ${SEC_INGESTION_ENABLED:-false}
      PUBLIC_STOCK_PAGES_ENABLED: ${PUBLIC_STOCK_PAGES_ENABLED:-false}
      RESEARCH_GENERATION_ENABLED: ${RESEARCH_GENERATION_ENABLED:-false}
      AI_RESEARCH_ENABLED: ${AI_RESEARCH_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_RESEARCH_MODEL: ${OPENAI_RESEARCH_MODEL:-gpt-5.4-mini-2026-03-17}
      AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD:-5}
      AI_USER_MONTHLY_BUDGET_USD: ${AI_USER_MONTHLY_BUDGET_USD:-1}
      AI_MAX_COST_PER_JOB_USD: ${AI_MAX_COST_PER_JOB_USD:-0.25}
      AI_MAX_TOKENS_PER_JOB: ${AI_MAX_TOKENS_PER_JOB:-50000}
      AI_MAX_OUTPUT_TOKENS_PER_CALL: ${AI_MAX_OUTPUT_TOKENS_PER_CALL:-1500}
      AI_PROVIDER_TIMEOUT_MS: ${AI_PROVIDER_TIMEOUT_MS:-20000}
      AI_USER_MONTHLY_REPORT_LIMIT: ${AI_USER_MONTHLY_REPORT_LIMIT:-5}
      PORTFOLIO_EXPORT_ENABLED: ${PORTFOLIO_EXPORT_ENABLED:-false}
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-false}

      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-local}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      NEXT_PUBLIC_SENTRY_RELEASE: ${NEXT_PUBLIC_SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-0}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-}

      BETTER_STACK_WORKER_HEARTBEAT_URL: ${BETTER_STACK_WORKER_HEARTBEAT_URL:-}
      BETTER_STACK_BACKUP_HEARTBEAT_URL: ${BETTER_STACK_BACKUP_HEARTBEAT_URL:-}
      BETTER_STACK_BACKUP_FAILURE_HEARTBEAT_URL: ${BETTER_STACK_BACKUP_FAILURE_HEARTBEAT_URL:-}
      LAST_RESTORE_DRILL_AT: ${LAST_RESTORE_DRILL_AT:-}
      LAST_RESTORE_DRILL_REFERENCE: ${LAST_RESTORE_DRILL_REFERENCE:-}
      LAST_COST_REVIEW_AT: ${LAST_COST_REVIEW_AT:-}
      LAST_COST_REVIEW_REFERENCE: ${LAST_COST_REVIEW_REFERENCE:-}
    ports:
      - "3000:3000"

  postgres:
    image: postgres:16-alpine
    container_name: portfolio-scope-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio_scope
      POSTGRES_USER: portfolio_scope
      POSTGRES_PASSWORD: portfolio_scope
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
