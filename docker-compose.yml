services:
  app:
    build:
      context: .
    container_name: portfolio-scope-app
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://portfolio_scope:portfolio_scope@postgres:5432/portfolio_scope?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DEMO_USER_EMAIL: demo@portfolioscope.dev
    ports:
      - "3000:3000"

  postgres:
    image: postgres:16-alpine
    container_name: portfolio-scope-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio_scope
      POSTGRES_USER: portfolio_scope
      POSTGRES_PASSWORD: portfolio_scope
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
