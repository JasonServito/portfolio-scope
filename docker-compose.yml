services:
  app:
    build:
      context: .
    container_name: portfolio-pulse-app
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://portfolio_pulse:portfolio_pulse@postgres:5432/portfolio_pulse?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DEMO_USER_EMAIL: demo@portfoliopulse.dev
    ports:
      - "3000:3000"

  postgres:
    image: postgres:16-alpine
    container_name: portfolio-pulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio_pulse
      POSTGRES_USER: portfolio_pulse
      POSTGRES_PASSWORD: portfolio_pulse
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
